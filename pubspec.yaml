name: fluttering
description: >
  A complete bootstrap toolkit for Flutter apps. Includes a lightweight custom
  Provider system, AwesomeApp entry point, theming, networking (Dio), storage,
  device info, permissions, connectivity, in-app review/update, and more.
version: 4.0.0
homepage: https://github.com/alexngo09092k/fluttering
repository: https://github.com/alexngo09092k/fluttering
issue_tracker: https://github.com/alexngo09092k/fluttering/issues

environment:
  sdk: ^3.6.1
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.5
  dio: ^5.7.0
  native_flutter_proxy: ^0.3.1
  mime_type: ^1.0.1
  path: ^1.9.0
  http_parser: ^4.0.2
  in_app_review: ^2.0.10
  huawei_hmsavailability: ^6.12.0+300
  version_comparator: ^1.0.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

topics:
  - flutter
  - bootstrap
  - provider
  - state-management
  - networking
  - theming
  - utilities

flutter:
